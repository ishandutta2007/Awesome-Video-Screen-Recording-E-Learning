<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="auto" style="border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes pulse-ring {
      0% { r: 6; opacity: 0.9; }
      50% { r: 14; opacity: 0; }
      100% { r: 6; opacity: 0.9; }
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes playhead-sweep {
      0% { transform: translateX(0px); }
      100% { transform: translateX(380px); }
    }
    @keyframes soundwave-1 { 0%, 100% { height: 8px; y: 196px; } 50% { height: 28px; y: 176px; } }
    @keyframes soundwave-2 { 0%, 100% { height: 24px; y: 180px; } 50% { height: 10px; y: 194px; } }
    @keyframes soundwave-3 { 0%, 100% { height: 16px; y: 188px; } 50% { height: 32px; y: 172px; } }
    @keyframes soundwave-4 { 0%, 100% { height: 30px; y: 174px; } 50% { height: 14px; y: 190px; } }
    @keyframes soundwave-5 { 0%, 100% { height: 12px; y: 192px; } 50% { height: 26px; y: 178px; } }
  </style>

  <!-- Background Base -->
  <rect width="860" height="260" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.2" />
  <rect width="860" height="260" rx="16" fill="url(#grid)" />

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="120" cy="60" r="140" fill="#6366f1" opacity="0.08" filter="url(#glow)" />
  <circle cx="760" cy="200" r="160" fill="#a855f7" opacity="0.09" filter="url(#glow)" />
  <circle cx="430" cy="130" r="180" fill="#ec4899" opacity="0.05" filter="url(#glow)" />

  <!-- Top Status Bar: Live Recording Indicator & Quality Badge -->
  <g transform="translate(48, 34)">
    <!-- REC Pill Box -->
    <rect width="112" height="28" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" opacity="0.9" />
    
    <!-- Animated Pulsing Red Ripple & Dot -->
    <circle cx="18" cy="14" r="5" fill="#ef4444">
      <animate attributeName="r" values="5;13;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="14" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite" />
    </circle>

    <text x="32" y="19" fill="#f87171" font-size="11" class="font-mono" font-weight="700" letter-spacing="1">REC 00:24</text>

    <!-- 4K 60FPS Pill -->
    <rect x="124" y="0" width="86" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.8" />
    <text x="136" y="18" fill="#38bdf8" font-size="11" class="font-mono" font-weight="600">4K • 60FPS</text>

    <!-- Curated Ecosystem Pill -->
    <rect x="220" y="0" width="138" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" opacity="0.8" />
    <text x="232" y="18" fill="#a5b4fc" font-size="11" class="font-mono" font-weight="600">⭐ OPEN &amp; SAAS</text>
  </g>

  <!-- Animated Sound Equalizer Waves (Bottom Right, subtle background atmosphere) -->
  <g transform="translate(640, 0)" opacity="0.75">
    <rect x="0" y="184" width="5" height="20" rx="2.5" fill="#6366f1">
      <animate attributeName="height" values="8;28;12;8" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="196;176;192;196" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="180" width="5" height="24" rx="2.5" fill="#818cf8">
      <animate attributeName="height" values="24;10;32;24" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="180;194;172;180" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="188" width="5" height="16" rx="2.5" fill="#a855f7">
      <animate attributeName="height" values="16;32;14;16" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="188;172;190;188" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="174" width="5" height="30" rx="2.5" fill="#c084fc">
      <animate attributeName="height" values="30;14;26;30" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="174;190;178;174" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="192" width="5" height="12" rx="2.5" fill="#ec4899">
      <animate attributeName="height" values="12;26;8;12" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="192;178;196;192" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="50" y="182" width="5" height="22" rx="2.5" fill="#f43f5e">
      <animate attributeName="height" values="22;12;30;22" dur="1.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="182;192;174;182" dur="1.0s" repeatCount="indefinite" />
    </rect>
    <rect x="60" y="186" width="5" height="18" rx="2.5" fill="#fb7185">
      <animate attributeName="height" values="18;30;10;18" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="186;174;194;186" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="188" width="5" height="16" rx="2.5" fill="#818cf8">
      <animate attributeName="height" values="14;24;16;14" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="190;180;188;190" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <text x="88" y="198" fill="#94a3b8" font-size="10" class="font-mono">AUDIO SYNC</text>
  </g>

  <!-- FOREGROUND MAIN CONTENT (Clear, Unobstructed, Highest Z-order) -->
  <g transform="translate(48, 108)" filter="url(#subtle-shadow)">
    <!-- Main Title -->
    <text x="0" y="24" fill="url(#title-grad)" font-size="29" class="font-title" letter-spacing="-0.5">
      Awesome Video Screen Recording &amp; E-Learning
    </text>

    <!-- Subtitle -->
    <text x="0" y="54" fill="#94a3b8" font-size="14.5" class="font-sub">
      Curated ecosystem of screen recorders, async video messaging, demo polish &amp; courseware
    </text>
  </g>

  <!-- Interactive Timeline / Track Visualization along bottom -->
  <g transform="translate(48, 186)">
    <!-- Timeline Track Background -->
    <rect width="460" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <!-- Video Segment Blocks -->
    <rect x="6" y="4" width="70" height="18" rx="3" fill="#3b82f6" opacity="0.75" />
    <text x="14" y="17" fill="#ffffff" font-size="9" class="font-mono">REC_01</text>

    <rect x="80" y="4" width="110" height="18" rx="3" fill="#8b5cf6" opacity="0.75" />
    <text x="88" y="17" fill="#ffffff" font-size="9" class="font-mono">ZOOM_IN &amp; PAN</text>

    <rect x="194" y="4" width="95" height="18" rx="3" fill="#ec4899" opacity="0.75" />
    <text x="202" y="17" fill="#ffffff" font-size="9" class="font-mono">QUIZ_SCORM</text>

    <rect x="293" y="4" width="100" height="18" rx="3" fill="#10b981" opacity="0.75" />
    <text x="301" y="17" fill="#ffffff" font-size="9" class="font-mono">AUTO_CAPTION</text>

    <!-- Animated Playhead Needle -->
    <line x1="20" y1="0" x2="20" y2="26" stroke="#f43f5e" stroke-width="2">
      <animate attributeName="x1" values="10;440;10" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="10;440;10" dur="7s" repeatCount="indefinite" />
    </line>
    <polygon points="17,0 23,0 20,5" fill="#f43f5e">
      <animate attributeName="points" values="7,0 13,0 10,5; 437,0 443,0 440,5; 7,0 13,0 10,5" dur="7s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Accent Top Border Highlight -->
  <rect x="16" y="0" width="828" height="3" fill="url(#accent-grad)" rx="1.5" />
</svg>
